# Frases que se anuncian por radio. Se convierten a audio UNA SOLA VEZ al
# instalar, no en el momento de la falla.
#
# Formato:  clave|texto
#
# El nodo se deletrea digito por digito a proposito: sobre RF, con ruido y
# desvanecimiento, "dos nueve nueve cero ocho cuatro" se entiende mucho mejor
# que "doscientos noventa y nueve mil ochenta y cuatro".
#
# Manten las frases CORTAS. Esto sale por un repetidor que otros estan usando,
# y se repite cada 15 minutos mientras dure la falla. Menos de 8 segundos.
#
# Tras editar este archivo hay que regenerar los audios:
#     sudo /usr/local/sbin/radio-alerta-generar.sh

sin_internet|Nodo dos nueve nueve cero ocho cuatro. Sin enlace a internet.
tunel_caido|Nodo dos nueve nueve cero ocho cuatro. Sin túnel de datos. Reintentando.
restablecido|Nodo dos nueve nueve cero ocho cuatro. Enlace restablecido.
